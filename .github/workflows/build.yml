name: Build Single HTML to APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'Zip file name (e.g. app.zip)'
        required: true
        default: 'app.zip'
      app_name:
        description: 'App Display Name'
        required: true
        default: 'My Web App'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find, Unzip, and Locate HTML
        run: |
          TARGET_ZIP="${{ github.event.inputs.zip_name }}"
          if [ -z "$TARGET_ZIP" ]; then
            TARGET_ZIP="Glue3D.zip"
          fi

          # Fallback to finding any zip if target name isn't exact
          if [ ! -f "$TARGET_ZIP" ]; then
            TARGET_ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          fi

          if [ -z "$TARGET_ZIP" ] || [ ! -f "$TARGET_ZIP" ]; then
            echo "Error: Could not find any .zip file in the repository!"
            exit 1
          fi

          echo "Unzipping $TARGET_ZIP..."
          mkdir -p extracted_html
          unzip -o "$TARGET_ZIP" -d extracted_html

          # Search for the first .html file extracted
          HTML_FILE=$(find extracted_html -type f -name "*.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "Error: No .html file found inside $TARGET_ZIP!"
            exit 1
          fi

          echo "Found HTML file: $HTML_FILE"
          mkdir -p www
          cp "$HTML_FILE" www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android

          APP_TITLE="${{ github.event.inputs.app_name }}"
          if [ -z "$APP_TITLE" ]; then
            APP_TITLE="My Web App"
          fi

          npx cap init "$APP_TITLE" "com.app.standalone" --web-dir "www"

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Navigation & File Access
        run: |
          node -e '
          const fs = require("fs");
          const configPath = "capacitor.config.json";
          if (fs.existsSync(configPath)) {
            let config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            config.server = config.server || {};
            config.server.allowNavigation = ["*"];
            config.android = config.android || {};
            config.android.allowMixedContent = true;
            fs.writeFileSync(configPath, JSON.stringify(config, null, 2));
          }
          '
          npx cap copy android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
